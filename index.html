<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dilkhush Editz Official | AI Photo Editing Prompts</title>
<meta name="description" content="Dilkhush Editz Official - trending AI photo editing prompts with photos and one-click copy.">
<style>
:root{color-scheme:dark;--bg:#080d19;--card:#121b2d;--accent:#29a9ff;--text:#f2f6ff;--muted:#b5c4da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{background:#101b30;padding:22px 16px;text-align:center;border-bottom:2px solid var(--accent)}h1{margin:0;font-size:clamp(24px,5vw,38px)}header p{color:var(--muted);margin:9px 0 0}nav{display:flex;gap:20px;justify-content:center;background:#14233b;padding:14px}nav a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:1050px;margin:auto;padding:22px 16px}.search{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #34506f;background:#17243a;color:white;font-size:16px;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:var(--card);border-radius:15px;overflow:hidden;cursor:pointer;border:1px solid #243955;transition:transform .2s}.card:hover{transform:translateY(-3px)}.card img{width:100%;height:220px;object-fit:cover;display:block}.card h2{font-size:19px;margin:14px}.card p{color:var(--muted);margin:0 14px 16px}.detail{max-width:750px;margin:auto;background:var(--card);padding:20px;border-radius:16px}.detail img{width:100%;max-height:550px;object-fit:contain;border-radius:10px;background:#080d19}.detail h2{line-height:1.4}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1323;border:1px solid #29405f;padding:16px;border-radius:10px;line-height:1.7;color:#e7f0ff}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}button{border:0;border-radius:9px;background:var(--accent);color:#001323;padding:12px 17px;font-weight:bold;cursor:pointer;font-size:15px}.secondary{background:#253e60;color:white}.hidden{display:none!important}.back{margin-bottom:16px}footer{text-align:center;color:var(--muted);padding:35px 15px}.empty{text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Dilkhush Editz Official</h1><p>Trending AI Photo Editing Prompts</p></header>
<nav><a href="#home" id="homeLink">🏠 Home</a><a href="#home" id="promptsLink">📸 AI Prompts</a></nav>
<main class="wrap"><section id="home"><input class="search" id="search" type="search" placeholder="🔍 Search photo prompts..." aria-label="Search prompts"><div class="grid" id="posts"></div><p class="empty hidden" id="empty">No matching posts found.</p></section><section id="detail" class="hidden"><button class="secondary back" id="back">← Back to posts</button><article class="detail"><img id="detailImage" alt="AI prompt example photo"><h2 id="detailTitle"></h2><h3>✨ AI PHOTO EDITING PROMPT</h3><div class="prompt" id="promptPreview"></div><div class="buttons"><button id="copy">📋 Copy Prompt</button><button id="full" class="secondary">👁 View Full Prompt</button></div></article></section></main>
<footer>© <span id="year"></span> Dilkhush Editz Official. All rights reserved.</footer>
<script>
/* ADD NEW POSTS HERE. Replace title, image, and prompt with your own content.
   Image can be a relative filename like images/photo1.jpg uploaded to GitHub.
   Add more objects separated by commas. */
const posts=[
 {id:'cinematic-ai-photo',title:'Cinematic AI Photo Editing Prompt',image:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1000&q=80',prompt:`YOUR PROMPT HERE. Replace this text with your complete AI photo editing prompt. Describe the person, clothes, lighting, background, camera angle and desired image style.`},
 {id:'nature-portrait',title:'Beautiful Nature Portrait AI Prompt',image:'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1000&q=80',prompt:`YOUR PROMPT HERE. Paste your second full prompt here. Visitors will see a short preview and can reveal or copy the complete prompt.`}
];
const $=id=>document.getElementById(id);let active=null,expanded=false;
function render(){const q=$('search').value.toLowerCase().trim(),found=posts.filter(p=>p.title.toLowerCase().includes(q));$('posts').replaceChildren();$('empty').classList.toggle('hidden',found.length!==0);found.forEach(p=>{const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','link');card.innerHTML='<img alt=""><h2></h2><p>Tap to view photo and copy prompt →</p>';card.querySelector('img').src=p.image;card.querySelector('img').alt=p.title;card.querySelector('h2').textContent=p.title;card.addEventListener('click',()=>{location.hash='post/'+encodeURIComponent(p.id)});card.addEventListener('keydown',e=>{if(e.key==='Enter')card.click()});$('posts').append(card)})}
function route(){const id=decodeURIComponent(location.hash.slice(1).replace(/^post\//,''));const p=location.hash.startsWith('#post/')?posts.find(x=>x.id===id):null;$('home').classList.toggle('hidden',!!p);$('detail').classList.toggle('hidden',!p);if(p){active=p;expanded=false;$('detailImage').src=p.image;$('detailImage').alt=p.title;$('detailTitle').textContent=p.title;document.title=p.title+' | Dilkhush Editz Official';updatePrompt();window.scrollTo(0,0)}else{active=null;document.title='Dilkhush Editz Official | AI Photo Editing Prompts'}}
function updatePrompt(){if(!active)return;const text=active.prompt;$('promptPreview').textContent=expanded||text.length<=170?text:text.slice(0,170)+'...';$('full').textContent=expanded?'🙈 Show Less':'👁 View Full Prompt';$('full').classList.toggle('hidden',text.length<=170)}
$('search').addEventListener('input',render);$('back').onclick=()=>{location.hash='home'};$('full').onclick=()=>{expanded=!expanded;updatePrompt()};$('copy').onclick=async()=>{if(!active)return;try{await navigator.clipboard.writeText(active.prompt);$('copy').textContent='✅ Copied!';setTimeout(()=>$('copy').textContent='📋 Copy Prompt',1800)}catch(e){const ta=document.createElement('textarea');ta.value=active.prompt;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();alert(ok?'Prompt copied!':'Copy failed. Please select the prompt text manually.')}};window.addEventListener('hashchange',route);$('year').textContent=new Date().getFullYear();render();route();
</script>
</body></html>
